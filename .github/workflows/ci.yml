name: ci
on:
  push: {}
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runner diagnostics
        if: github.ref == 'refs/heads/fix/actions-diagnostics-20260822-1500' || github.event_name == 'workflow_dispatch'
        run: |
          echo "===== Runner diagnostics ====="
          echo "Runner: $(uname -a)"
          echo "GitHub event: $GITHUB_EVENT_NAME"
          date
          whoami
          env
          ls -la
          df -h
          echo "==============================="
      - name: Repository distinction doctor
        run: python scripts/doctor.py
      - name: Simulator tests
        run: python -m unittest discover -s tests -v
      - name: Specification basis contract tests
        run: python decompose-task-space/spec/tests/test_spec_basis.py -v
      - name: Autoresearch smoke
        run: python autoresearch.py --variant exploit --iterations 3 --seed 42
      - name: Specification scheduler smoke
        run: python decompose-task-space/spec/simulate_spec_basis.py --limit 16 > /tmp/spec-probes.json
      - name: Flywheel architecture simulation replay
        run: python tools/simulate_flywheel_architecture.py --out /tmp/flywheel-receipt.json
      - name: Dependency-atomic bead graph verification
        run: python experiments/decomposition-policy/verify_decomposition_beads.py
